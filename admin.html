<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SUSHI PARA — панель управления</title>
<link rel="icon" href="assets/logo.jpg">
<style>
:root{--paper:#F7F1E6;--card:#FFFCF6;--line:#E6D9C2;--ink:#1B1714;--muted:#6A6056;--red:#B8322A;--green:#1F8A4C;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:700;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.field{display:block;margin:0}
.field>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=tel],input[type=number],input[type=password],select,textarea{width:100%;min-height:42px;padding:8px 12px;border:1.5px solid #D8C8AC;border-radius:10px;background:#fff}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted)}

/* вход */
#login{max-width:560px;margin:6vh auto;padding:28px;background:var(--card);border:1px solid var(--line);border-radius:18px}
#login h1{font-size:24px;margin-bottom:6px}
#login ol{padding-left:20px;margin:12px 0}
#login li{margin:6px 0}
#login code{background:#F2E9DA;padding:1px 6px;border-radius:6px}
#login .field{margin-top:10px}
#login details{margin:14px 0 4px;padding:12px 14px;border:1px dashed #D8C8AC;border-radius:12px;background:#FFFDF9}
#login summary{font-weight:700;cursor:pointer}
.err{margin-top:10px;color:var(--red);font-weight:700}

/* шапка панели */
#bar{position:sticky;top:0;z-index:20;background:rgba(247,241,230,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
#bar .t{font-weight:800;font-size:17px;margin-right:auto}
#status{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#EDE3D0;color:var(--muted)}
#status.dirty{background:#FBE3B6;color:#7A4A00}
#status.ok{background:#D9F0E0;color:#17603A}
#status.bad{background:#F7D4D0;color:#8E1E17}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid #D8C8AC;background:var(--card);cursor:pointer;font-weight:700;white-space:nowrap}
.tab[aria-current=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tab .n{font-weight:500;opacity:.7;margin-left:6px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.panel h2{font-size:18px;margin-bottom:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}

/* блюда */
.item{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;overflow:hidden}
.item.off{opacity:.62}
.ihead{display:flex;align-items:center;gap:12px;padding:10px}
.ihead img,.ihead .noimg{width:76px;height:57px;border-radius:8px;object-fit:cover;background:#F2E9DA;flex:0 0 auto}
.ihead .nm{flex:1;min-width:0}
.ihead .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ihead .nm span{font-size:13px;color:var(--muted)}
.sw{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.sw input{width:20px;height:20px}
.ibody{border-top:1px dashed var(--line);padding:14px;background:#FFFDF9;display:grid;gap:12px}
.photo{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photo img{width:200px;height:150px;border-radius:10px;object-fit:cover;background:#F2E9DA}
.sizes{display:grid;gap:8px}
.sizes .s{display:flex;gap:8px;align-items:end}
.sizes .s label{flex:1}
.textrow{padding:12px 0;border-top:1px dashed var(--line)}
.textrow:first-of-type{border-top:none}
.textrow .lbl{font-weight:700;margin-bottom:2px}
.langtag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;max-width:min(92vw,560px);padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--paper);font-weight:700;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);display:none}
#toast.on{display:block}
@media (max-width:760px){.g3,.g2{grid-template-columns:1fr}.panel{padding:12px}.ihead{flex-wrap:wrap;gap:8px}.ihead img,.ihead .noimg{margin-right:4px}.ihead .nm{flex:1 1 calc(100% - 100px)}.ihead .btn.small{padding:0 10px}.ihead [data-act=edit]{margin-left:auto}#bar .t{display:none}#status{margin-right:auto}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>

<script>
// ============================================================================================
// Панель управления сайтом SUSHI PARA.
// Работает прямо в браузере: читает и сохраняет файл data.js (и фото блюд) в репозитории на GitHub
// через GitHub API. Владелец входит по телефону и паролю: ключ GitHub (token) лежит в репозитории
// в файле auth.json в зашифрованном виде (AES-GCM, ключ шифра — PBKDF2 от телефона и пароля),
// расшифровывается прямо в браузере и никуда, кроме api.github.com, не отправляется.
// Сам пароль нигде не хранится. Ключ GitHub владелец вводит один раз — при первой настройке.
// ============================================================================================
const REPO = { owner: 'abuwkaa', repo: 'sushi-para', branch: 'main' };
// Автор коммитов — служебный адрес GitHub, чтобы личная почта не попадала в публичную историю
const AUTHOR = { name: 'abuwkaa', email: '173940425+abuwkaa@users.noreply.github.com' };
const DATA_PATH = 'data.js';
const AUTH_PATH = 'auth.json';
const KDF_ITER = 3000000;   // число шагов PBKDF2: замедляет подбор пароля
const DATA_HEADER = '// Данные сайта: меню, цены и тексты. Этот файл меняет админ-панель (admin.html) — вручную лучше не править.\n';
// Адрес API можно подменить (?api=…) только при локальной разработке — на живом сайте всегда api.github.com
const IS_LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const API = (IS_LOCAL && new URLSearchParams(location.search).get('api')) || 'https://api.github.com';
const LANGS = [['ky', 'Кыргызча'], ['ru', 'Русский'], ['en', 'English']];
const TEXT_GROUPS = [
  ['Главный экран', [
    ['eyebrow', 'Строка над заголовком'],
    ['h1', 'Главный заголовок', 'Enter — новая строка. Слово в *звёздочках* будет выделено красным.'],
    ['lead', 'Текст под заголовком'],
    ['cta_order', 'Кнопка заказа'],
    ['nav_menu', '«Меню» — в шапке и в заголовке раздела'],
    ['nav_contacts', '«Контакты» — в шапке и на кнопке']]],
  ['Меню и карточки блюд', [
    ['menu_p', 'Подсказка над меню'],
    ['add', 'Кнопка «В заказ»'],
    ['cm', 'Единица размера (см)'],
    ['som', 'Валюта']]],
  ['Корзина и заказ в WhatsApp', [
    ['addr_ph', 'Подсказка в поле адреса'],
    ['clear', 'Кнопка «Очистить»'],
    ['send', 'Кнопка отправки заказа'],
    ['count_one', 'Счётчик: одно блюдо', '{n} — количество.'],
    ['count_few', 'Счётчик: 2–4 блюда', '{n} — количество. Нужно только для русского языка.'],
    ['count_many', 'Счётчик: 5 и больше блюд', '{n} — количество.'],
    ['msg_intro', 'Сообщение в WhatsApp: первая строка'],
    ['msg_total', 'Сообщение в WhatsApp: слово «Итого»'],
    ['msg_addr', 'Сообщение в WhatsApp: «Адрес доставки»']]],
  ['Контакты внизу страницы', [
    ['f_phone', 'Подпись «Телефон»'],
    ['f_wa', 'Ссылка «Написать в WhatsApp»'],
    ['f_addr_l', 'Подпись «Адрес»'],
    ['f_addr', 'Адрес ресторана'],
    ['f_hours_l', 'Подпись «Часы работы»'],
    ['f_hours', 'Часы работы']]],
  ['Для поисковиков и вкладки браузера', [
    ['title', 'Заголовок вкладки'],
    ['meta', 'Описание для поисковиков и превью в мессенджерах'],
    ['logo_alt', 'Описание логотипа']]],
  ['Служебные подписи (для программ чтения с экрана)', [
    ['nav_aria', 'Навигация'], ['tabs_aria', 'Лента разделов меню'], ['cart_aria', 'Корзина'], ['addr', 'Поле адреса'],
    ['size', 'Выбор размера'], ['dec', 'Кнопка «−»'], ['inc', 'Кнопка «+»']]],
];

// ---------- утилиты ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const b64ToText = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
function getPath(o, path) { return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, path, val) { const ks = path.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => (a[k] == null ? (a[k] = {}) : a[k]), o); t[last] = val; }
let toastTimer = 0;
function toast(msg, ms = 3500) { const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), ms); }

// ---------- GitHub API ----------
let token = '';
try { token = localStorage.getItem('sp-admin-token') || ''; } catch (e) {}
async function gh(method, path, body) {
  const r = await fetch(`${API}/repos/${REPO.owner}/${REPO.repo}${path}`, {
    method, cache: 'no-store',
    headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!r.ok) {
    let m = ''; try { m = (await r.json()).message || ''; } catch (e) {}
    const err = new Error(m || ('Ошибка ' + r.status)); err.status = r.status; throw err;
  }
  return r.status === 204 ? null : r.json();
}
function explain(e) {
  if (e.status === 401) return 'Ключ GitHub не принят: он неверный или срок его действия истёк.';
  if (e.status === 403) return 'У ключа нет права изменять сайт. Нужен доступ к репозиторию sushi-para с правом Contents: Read and write.';
  if (e.status === 404) return 'Репозиторий не найден для этого ключа. Проверьте, что ключ выдан именно на sushi-para.';
  if (e.status === 409 || e.status === 422) return 'GitHub отклонил сохранение (' + e.message + '). Обновите страницу и попробуйте ещё раз.';
  if (!e.status) return 'Нет связи с GitHub. Проверьте интернет и попробуйте ещё раз.';
  return 'Ошибка GitHub: ' + e.message;
}

// ---------- вход: ключ GitHub, зашифрованный телефоном и паролем ----------
const normPhone = p => { let d = String(p).replace(/\D/g, ''); if (d.length === 10 && d[0] === '0') d = '996' + d.slice(1); else if (d.length === 9) d = '996' + d; return d; };
const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const fromB64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
async function deriveKey(phone, password, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normPhone(phone) + '\n' + password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealToken(phone, password, tok) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await deriveKey(phone, password, salt, KDF_ITER), new TextEncoder().encode(tok));
  return { v: 1, kdf: 'PBKDF2-SHA256', iter: KDF_ITER, salt: toB64(salt), iv: toB64(iv), ct: toB64(ct) };
}
async function openToken(phone, password, a) {   // бросает ошибку, если телефон или пароль не подошли
  const key = await deriveKey(phone, password, fromB64(a.salt), a.iter);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(a.iv) }, key, fromB64(a.ct)));
}
async function loadAuth() {   // null — вход ещё не настроен
  try {
    const r = await fetch(`${API}/repos/${REPO.owner}/${REPO.repo}/contents/${AUTH_PATH}?ref=${REPO.branch}`, { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
    if (r.status === 404) return null;
    if (r.ok) return JSON.parse(b64ToText((await r.json()).content));
  } catch (e) {}
  const r = await fetch(AUTH_PATH + '?v=' + Date.now(), { cache: 'no-store' });   // запасной путь — копия на самом сайте
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('auth');
  return r.json();
}
async function commitFiles(tree, message, parent) {
  if (!parent) parent = (await gh('GET', `/git/ref/heads/${REPO.branch}`)).object.sha;
  const pc = await gh('GET', `/git/commits/${parent}`);
  const nt = await gh('POST', '/git/trees', { base_tree: pc.tree.sha, tree });
  const commit = await gh('POST', '/git/commits', { message, tree: nt.sha, parents: [parent], author: AUTHOR, committer: AUTHOR });
  await gh('PATCH', `/git/refs/heads/${REPO.branch}`, { sha: commit.sha });
  return commit.sha;
}
async function saveAuth(phone, password) {
  const blob = await gh('POST', '/git/blobs', { content: JSON.stringify(await sealToken(phone, password, token), null, 1) + '\n', encoding: 'utf-8' });
  await commitFiles([{ path: AUTH_PATH, mode: '100644', type: 'blob', sha: blob.sha }], 'Панель: телефон и пароль для входа');
}
function checkCreds(phone, pw, pw2) {
  if (normPhone(phone).length < 9) return 'Проверьте номер телефона.';
  if (pw.length < 6) return 'Пароль должен быть не короче 6 символов.';
  if (pw !== pw2) return 'Пароли не совпадают.';
  return '';
}

// ---------- состояние ----------
let data = null;          // рабочая копия данных сайта
let savedJSON = '';       // то, что сейчас опубликовано (для сравнения)
let headSha = '';         // коммит, с которого загружены данные
let dataBlobSha = '';     // версия data.js, с которой начали правку
let newImages = {};       // путь -> { url } — фото (data-URL), выбранные, но ещё не опубликованные
let view = 'menu';        // menu | texts | settings
let catIdx = 0;           // выбранный раздел
let openItem = '';        // id раскрытого блюда
let busy = false;
const isDirty = () => !!data && (JSON.stringify(data) !== savedJSON || Object.keys(newImages).length > 0);
const serialize = d => DATA_HEADER + 'window.SITE_DATA = ' + JSON.stringify(d, null, 1) + ';\n';
function parseData(text) { return JSON.parse(text.slice(text.indexOf('{'), text.lastIndexOf('}') + 1)); }
function saveDraft() {
  try {
    if (isDirty()) localStorage.setItem('sp-admin-draft', JSON.stringify({ base: dataBlobSha, data, newImages }));
    else localStorage.removeItem('sp-admin-draft');
  } catch (e) { /* черновик не поместился (много фото) — не страшно */ }
}
window.addEventListener('beforeunload', e => { if (isDirty()) { e.preventDefault(); e.returnValue = ''; } });

async function loadAll() {
  const ref = await gh('GET', `/git/ref/heads/${REPO.branch}`);
  headSha = ref.object.sha;
  const file = await gh('GET', `/contents/${DATA_PATH}?ref=${headSha}`);
  dataBlobSha = file.sha;
  data = parseData(b64ToText(file.content));
  savedJSON = JSON.stringify(data); newImages = {};
  let restored = false;
  try {
    const d = JSON.parse(localStorage.getItem('sp-admin-draft') || 'null');
    if (d && d.base === dataBlobSha && d.data) { data = d.data; newImages = d.newImages || {}; restored = isDirty(); }
    else localStorage.removeItem('sp-admin-draft');
  } catch (e) {}
  return restored;
}

// ---------- экраны: вход и первая настройка ----------
function formBusy(text) { const e = $('#ferr'); e.hidden = true; const b = $('#fgo'); b.disabled = true; b.textContent = text; }
function formError(msg) { const e = $('#ferr'); e.textContent = msg; e.hidden = false; const b = $('#fgo'); b.disabled = false; b.textContent = b.dataset.label; }
function renderLogin(error) {
  $('#app').innerHTML = `<form id="login">
    <h1>Панель управления SUSHI PARA</h1>
    <p class="hint">Меню, цены, фото и все тексты сайта.</p>
    <label class="field"><span>Телефон</span><input type="tel" id="ph" autocomplete="username" inputmode="tel" placeholder="0557 55 70 85" required></label>
    <label class="field"><span>Пароль</span><input type="password" id="pw" autocomplete="current-password" required></label>
    <div class="err" id="ferr" ${error ? '' : 'hidden'}>${esc(error || '')}</div>
    <div class="rowbtns" style="margin-top:14px"><button class="btn primary" id="fgo" data-label="Войти" type="submit">Войти</button><a class="btn" href="./">Открыть сайт</a></div>
    <p class="hint" style="margin:16px 0 0"><a href="#" id="tosetup">Первая настройка или забыли пароль</a></p>
  </form>`;
  $('#tosetup').addEventListener('click', e => { e.preventDefault(); renderSetup(); });
  $('#login').addEventListener('submit', async e => {
    e.preventDefault(); formBusy('Проверяю…');
    let a; try { a = await loadAuth(); } catch (x) { return formError('Нет связи. Проверьте интернет и попробуйте ещё раз.'); }
    if (!a) return renderSetup('Вход ещё не настроен — это делается один раз.');
    try { token = await openToken($('#ph').value, $('#pw').value, a); } catch (x) { token = ''; return formError('Неверный телефон или пароль.'); }
    await start(true);
  });
}
function renderSetup(note) {
  const link = 'https://github.com/settings/personal-access-tokens/new?name=sushi-para-admin&description=' + encodeURIComponent('Панель управления сайтом SUSHI PARA')
    + `&target_name=${encodeURIComponent(REPO.owner)}&expires_in=none&contents=write`;
  $('#app').innerHTML = `<form id="login">
    <h1>Первая настройка входа</h1>
    <p class="hint">${esc(note || 'Делается один раз (или если забыли пароль).')} Потом в панель входят просто по телефону и паролю — с любого устройства.</p>
    <label class="field"><span>Телефон для входа</span><input type="tel" id="ph" autocomplete="username" inputmode="tel" placeholder="0557 55 70 85" required></label>
    <label class="field"><span>Пароль</span><input type="password" id="pw" autocomplete="new-password" required></label>
    <label class="field"><span>Пароль ещё раз</span><input type="password" id="pw2" autocomplete="new-password" required></label>
    <p class="hint" style="margin:6px 0 0">Короткий пароль легко подобрать. Надёжнее — от 10 символов, буквы и цифры.</p>
    <details open><summary>Ключ GitHub — нужен только сейчас, один раз</summary>
      <p class="hint" style="margin:8px 0 0">Сайт хранится на GitHub, и чтобы панель могла его менять, ей нужен ключ. Он будет зашифрован вашим паролем, вводить его больше не придётся.</p>
      <ol>
        <li>Откройте <a href="${link}" target="_blank" rel="noopener">создание ключа на GitHub</a> (аккаунт <b>${esc(REPO.owner)}</b>).</li>
        <li><b>Repository access</b> → <b>Only select repositories</b> → выберите <code>${esc(REPO.repo)}</code>.</li>
        <li>Проверьте: <b>Expiration</b> — <b>No expiration</b>; <b>Permissions</b> → <b>Contents</b> — <b>Read and write</b>.</li>
        <li>Нажмите <b>Generate token</b>, скопируйте ключ (начинается с <code>github_pat_</code>) и вставьте ниже.</li>
      </ol>

// ---------- фото: обрезка до 4:3 и сжатие прямо в браузере ----------
function fileToImage(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => { URL.revokeObjectURL(url); res(im); }; im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Не удалось прочитать файл как изображение.')); }; im.src = url; });
}
async function preparePhoto(file) {
  const im = await fileToImage(file), W = 1200, H = 900;
  const k = Math.max(W / im.naturalWidth, H / im.naturalHeight), sw = W / k, sh = H / k;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  cv.getContext('2d').drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, 0, 0, W, H);
  let url = cv.toDataURL('image/webp', 0.82), ext = 'webp';
  if (!url.startsWith('data:image/webp')) { url = cv.toDataURL('image/jpeg', 0.85); ext = 'jpg'; }   // старые браузеры не умеют WebP
  return { url, ext };
}

// ---------- проверка и публикация ----------
function validate() {
  const errs = [], ids = new Set();
  data.categories.forEach(c => {
    const cn = c.name.ru || c.name.ky || c.name.en;
    if (!cn) errs.push('У одного из разделов нет названия.');
    c.items.forEach(it => {
      const n = it.name.ru || it.name.ky || it.name.en;
      if (!n) errs.push(`В разделе «${cn || '?'}» есть блюдо без названия.`);
      if (ids.has(it.id)) it.id = uid('d'); ids.add(it.id);
      if (it.sizes && it.sizes.length) {
        const seen = new Set();
        it.sizes.forEach(z => { if (!(z.cm > 0)) errs.push(`«${n}»: у размера не указаны сантиметры.`); if (seen.has(z.cm)) errs.push(`«${n}»: размер ${z.cm} см указан дважды.`); seen.add(z.cm); });
      } else if (!(it.price >= 0) || it.price === '') errs.push(`«${n}»: не указана цена.`);
    });
  });
  if (!((data.settings.whatsapp || '').replace(/\D/g, '').length >= 9)) errs.push('В настройках не указан номер WhatsApp — заказы некуда отправлять.');
  return [...new Set(errs)];
}

  busy = true; refreshBar();
  try {
    // 1. Не изменились ли данные на сайте, пока панель была открыта (правка с другого устройства)?
    const ref = await gh('GET', `/git/ref/heads/${REPO.branch}`); let parent = ref.object.sha;
    if (parent !== headSha) {
      const cur = await gh('GET', `/contents/${DATA_PATH}?ref=${parent}`);
      if (cur.sha !== dataBlobSha && !confirm('Пока панель была открыта, меню на сайте изменили с другого устройства.\n\nОК — опубликовать мои правки поверх (чужие правки пропадут).\nОтмена — ничего не публиковать.')) { busy = false; refreshBar(); return; }
    }
    // 2. Используемые новые фото и сам файл данных -> один общий коммит
    const used = new Set(data.categories.flatMap(c => c.items.map(i => i.img)));
    const tree = [];
    for (const [path, im] of Object.entries(newImages)) {
      if (!used.has(path)) continue;
      const blob = await gh('POST', '/git/blobs', { content: im.url.slice(im.url.indexOf(',') + 1), encoding: 'base64' });
      tree.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
    }
    const dblob = await gh('POST', '/git/blobs', { content: serialize(data), encoding: 'utf-8' });
    tree.push({ path: DATA_PATH, mode: '100644', type: 'blob', sha: dblob.sha });
    headSha = await commitFiles(tree, 'Панель: обновление меню и текстов', parent); dataBlobSha = dblob.sha; savedJSON = JSON.stringify(data); newImages = {};
    try { localStorage.removeItem('sp-admin-draft'); } catch (x) {}
    busy = false; render();
    toast('Опубликовано. Сайт обновится через 1–3 минуты.', 6000);
  } catch (e) {
    busy = false; refreshBar();
    const st = $('#status'); if (st) { st.textContent = 'Не опубликовано'; st.className = 'bad'; }
    alert('Не удалось опубликовать.\n\n' + explain(e) + '\n\nВаши правки не потеряны — они остались в панели.');
  }
}

start(false);
</script>
</body>
</html>
